# Continuous integration pipeline of Marginália.
# For now it only builds the software. Add one job for SAST, one for the
# tests and one for DAST.
name: CI

on:
  push:
    branches: ["develop", "feature/**"]
  pull_request:
    branches: ["develop"]

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Build the software and the unit tests
        run: make

  sast:
    name: SAST
    runs-on: ubuntu-24.04
    needs: build
    steps:
      - uses: actions/checkout@v6

      - name: Install pipx
        run: |
          sudo apt-get update
          sudo apt-get install -y pipx
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install Semgrep
        run: pipx install semgrep==1.182.1

      - name: Run SAST
        run: make sast

  tests:
    name: Tests
    runs-on: ubuntu-24.04
    needs: build
    steps:
      - uses: actions/checkout@v6

      - name: Install Valgrind
        run: |
          sudo apt-get update
          sudo apt-get install -y valgrind

      - name: Run tests with ASan and UBSan
        run: make sanitizers

      - name: Run tests with Valgrind
        run: make valgrind

  dast:
    name: DAST
    runs-on: ubuntu-24.04
    needs: build
    steps:
      - uses: actions/checkout@v6

      - name: Run DAST
        run: make dast